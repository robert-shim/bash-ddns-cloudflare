##########################################################
###  Configurations for Dynamic DNS-Cloudflare Script  ###
##########################################################

## !! Make sure to lock this file down with permissions !!

# Domain name
FQDN="your.domain.com"

# From your Cloudflare account dashboard
CLOUDFLARE_ZONE_ID="changeme"

# PATCH method does not change the DNS record ID
CLOUDFLARE_DNS_RECORD_ID="changeme"

# Make sure your API token does not get leaked!
CLOUDFLARE_API_TOKEN="changeme"

# Not sure by how much, but want to do Cloudflare a small favor with load balancing
CLOUDFLARE_NAMESERVERS=("changeme1.ns.cloudflare.com" "changeme2.ns.cloudflare.com")

# Local memory cache (If running multiple, rename and avoid overwriting)
MEMORY_FILE_CLOUDFLARE_DNS="/tmp/memory_cloudflare_dns"
